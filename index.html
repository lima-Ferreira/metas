<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emerald Ultra | Gestão de Metas</title>

    <style>
        :root {
            --bg: #0b111e;
            --card: #161d2f;
            --text: #f3f4f6;
            --accent: #10b981;
            --warning: #f97316;
            --danger: #ef4444;
            --info: #3b82f6;
            --border: #2d3748;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: sans-serif;
            padding: 15px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        header h1 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 200;
            letter-spacing: 4px;
            font-size: 1.6rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
        }

        h2 {
            font-size: .75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #0b111e;
            color: white;
            font-size: 1rem;
            margin-bottom: 12px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #475569;
        }

        button {
            background: var(--accent);
            color: black;
            font-weight: bold;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
        }

        button:hover {
            opacity: .9;
        }

        .btn-reset {
            background: var(--danger);
            color: white;
            font-size: .75rem;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .chart-card {
            background: #111827;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
        }

        .chart-title {
            font-size: .75rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: #94a3b8;
        }

        .chart-wrapper {
            position: relative;
            width: 180px;
            height: 180px;
            margin: auto;
        }

        svg {
            transform: rotate(-90deg);
        }

        circle {
            fill: none;
            stroke-width: 8;
            stroke-linecap: round;
        }

        .bg-circle {
            stroke: #1e293b;
        }

        .progress-circle {
            stroke-dasharray: 251.2;
            stroke-dashoffset: 251.2;
            transition: .6s ease;
        }

        .center-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .percent {
            font-size: 2.4rem;
            font-weight: bold;
            line-height: 1;
        }

        .status {
            margin-top: 6px;
            font-size: .7rem;
            letter-spacing: 1px;
            color: #94a3b8;
        }

        .value {
            margin-top: 18px;
        }

        .value small {
            display: block;
            font-size: .7rem;
            color: #94a3b8;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .value b {
            font-size: 1.2rem;
        }

        .extra {
            margin-top: 10px;
            font-size: .85rem;
            font-weight: bold;
        }

        .verde {
            color: var(--accent);
        }

        .laranja {
            color: var(--warning);
        }

        .vermelho {
            color: var(--danger);
        }

        .azul {
            color: var(--info);
        }

        .resumo {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .resumo-item {
            background: #111827;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .resumo-item small {
            display: block;
            color: #94a3b8;
            font-size: .65rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .resumo-item b {
            font-size: 1rem;
        }

        @media(max-width: 1000px) {

            .grid {
                grid-template-columns: 1fr;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }

            .resumo {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media(max-width: 600px) {

            .resumo {
                grid-template-columns: 1fr;
            }

            .chart-wrapper {
                width: 150px;
                height: 150px;
            }

            .percent {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h1>
                METAS
                <b id="header-loja" style="color:var(--accent)">
                    POR LOJAS
                </b>
            </h1>
        </header>

        <div class="grid">

            <!-- FORM -->
            <div class="card">

                <h2>Lançamento Diário</h2>

                <form id="metaForm" onsubmit="salvarDados(event)">

                    <select id="loja" onchange="carregarLojaSelecionada()">
                    </select>

                    <input
                        type="text"
                        id="meta_mensal"
                        placeholder="Meta mensal"
                        oninput="aplicarMascaraMoeda(this)"
                        required
                    >

                    <input
                        type="text"
                        id="venda_acumulada"
                        placeholder="Acumulado até ontem"
                        oninput="aplicarMascaraMoeda(this)"
                        required
                    >

                    <input
                        type="text"
                        id="venda_hoje"
                        placeholder="Venda de hoje"
                        oninput="aplicarMascaraMoeda(this)"
                        required
                    >

                    <button type="submit">
                        Atualizar Indicadores
                    </button>

                    <button
                        type="button"
                        class="btn-reset"
                        onclick="resetarSistema()"
                    >
                        Limpar Banco de Dados
                    </button>

                </form>

            </div>

            <!-- DASHBOARD -->
            <div>

                <div class="charts-grid">

                    <!-- META DIÁRIA -->
                    <div class="chart-card">

                        <div class="chart-title">
                            META DIÁRIA
                        </div>

                        <div class="chart-wrapper">

                            <svg width="180" height="180" viewBox="0 0 100 100">

                                <circle
                                    class="bg-circle"
                                    cx="50"
                                    cy="50"
                                    r="40"
                                ></circle>

                                <circle
                                    id="circle-dia"
                                    class="progress-circle"
                                    cx="50"
                                    cy="50"
                                    r="40"
                                ></circle>

                            </svg>

                            <div class="center-content">

                                <div
                                    id="percent-dia"
                                    class="percent vermelho"
                                >
                                    0%
                                </div>

                                <div
                                    id="status-dia"
                                    class="status"
                                >
                                    META DO DIA
                                </div>

                            </div>

                        </div>

                        <div class="value">

                            <small>VENDIDO HOJE</small>

                            <b id="valor-dia">
                                R$ 0,00
                            </b>

                        </div>

                        <div
                            id="extra-dia"
                            class="extra"
                        >
                        </div>

                    </div>

                    <!-- META MENSAL -->
                    <div class="chart-card">

                        <div class="chart-title">
                            META MENSAL
                        </div>

                        <div class="chart-wrapper">

                            <svg width="180" height="180" viewBox="0 0 100 100">

                                <circle
                                    class="bg-circle"
                                    cx="50"
                                    cy="50"
                                    r="40"
                                ></circle>

                                <circle
                                    id="circle-mes"
                                    class="progress-circle"
                                    cx="50"
                                    cy="50"
                                    r="40"
                                    style="stroke: var(--info)"
                                ></circle>

                            </svg>

                            <div class="center-content">

                                <div
                                    id="percent-mes"
                                    class="percent azul"
                                >
                                    0%
                                </div>

                                <div class="status">
                                    DO MÊS
                                </div>

                            </div>

                        </div>

                        <div class="value">

                            <small>ACUMULADO</small>

                            <b id="valor-mes">
                                R$ 0,00
                            </b>

                        </div>

                        <div
                            id="extra-mes"
                            class="extra azul"
                        >
                        </div>

                    </div>

                </div>

                <!-- RESUMO -->
                <div class="resumo">

                    <div class="resumo-item">
                        <small>META DIÁRIA</small>
                        <b id="meta-dia">
                            R$ 0,00
                        </b>
                    </div>

                    <div class="resumo-item">
                        <small>META MENSAL</small>
                        <b id="meta-mes">
                            R$ 0,00
                        </b>
                    </div>

                    <div class="resumo-item">
                        <small>ACUMULADO</small>
                        <b id="acumulado-total">
                            R$ 0,00
                        </b>
                    </div>

                    <div class="resumo-item">
                        <small>FALTA NO MÊS</small>
                        <b id="faltante-mes">
                            R$ 0,00
                        </b>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>

        const DB_KEY = 'emerald_duplo_v1';

        let dadosLojas =
            JSON.parse(localStorage.getItem(DB_KEY)) || {};

        window.onload = () => {

            configurarSelect();

            carregarLojaSelecionada();
        };

        function configurarSelect() {

            const select =
                document.getElementById('loja');

            select.innerHTML = '';

            for (let i = 1; i <= 9; i++) {

                const nome =
                    `Loja ${String(i).padStart(2, '0')}`;

                const option =
                    document.createElement('option');

                option.value = nome;

                option.textContent = nome;

                select.appendChild(option);
            }
        }

        function aplicarMascaraMoeda(input) {

            let valor =
                input.value.replace(/\D/g, '');

            valor =
                (valor / 100).toFixed(2) + '';

            valor =
                valor.replace('.', ',');

            valor =
                valor.replace(/\B(?=(\d{3})+(?!\d))/g, '.');

            input.value = valor;
        }

        function moedaParaNumero(valor) {

            return parseFloat(
                valor
                    .replace(/\./g, '')
                    .replace(',', '.')
            ) || 0;
        }

        function formatarMoeda(valor) {

            return valor.toLocaleString(
                'pt-BR',
                {
                    style: 'currency',
                    currency: 'BRL'
                }
            );
        }

        function formatarInput(valor) {

            return valor.toLocaleString(
                'pt-BR',
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            );
        }

        function carregarLojaSelecionada() {

            const lojaAtual =
                document.getElementById('loja').value;

            document.getElementById('header-loja').innerText =
                lojaAtual.toUpperCase();

            if (dadosLojas[lojaAtual]) {

                const dados =
                    dadosLojas[lojaAtual];

                document.getElementById('meta_mensal').value =
                    formatarInput(dados.meta_mensal);

                document.getElementById('venda_acumulada').value =
                    formatarInput(dados.venda_acumulada);

                document.getElementById('venda_hoje').value =
                    formatarInput(dados.venda_hoje);

                renderizarDashboard(dados);

            } else {

                document.getElementById('meta_mensal').value = '';
                document.getElementById('venda_acumulada').value = '';
                document.getElementById('venda_hoje').value = '';

                zerarDashboard();
            }
        }

        function salvarDados(event) {

            event.preventDefault();

            const lojaAtual =
                document.getElementById('loja').value;

            const registro = {

                meta_mensal:
                    moedaParaNumero(
                        document.getElementById('meta_mensal').value
                    ),

                venda_acumulada:
                    moedaParaNumero(
                        document.getElementById('venda_acumulada').value
                    ),

                venda_hoje:
                    moedaParaNumero(
                        document.getElementById('venda_hoje').value
                    )
            };

            dadosLojas[lojaAtual] = registro;

            localStorage.setItem(
                DB_KEY,
                JSON.stringify(dadosLojas)
            );

            renderizarDashboard(registro);
        }

        function renderizarDashboard(dados) {

            const metaMensal =
                dados.meta_mensal;

            const acumuladoAnterior =
                dados.venda_acumulada;

            const vendaHoje =
                dados.venda_hoje;

            const acumuladoTotal =
                acumuladoAnterior + vendaHoje;

            const faltanteMes =
                metaMensal - acumuladoTotal;

            // META DIÁRIA
            const diasEquivalentes = 11;

            const metaHoje =
                faltanteMes > 0
                    ? faltanteMes / diasEquivalentes
                    : 0;

            // PORCENTAGEM DIA
            let percentualDia = 0;

            if (metaHoje > 0) {

                percentualDia =
                    (vendaHoje / metaHoje) * 100;
            }

            // PORCENTAGEM MÊS
            let percentualMes = 0;

            if (metaMensal > 0) {

                percentualMes =
                    (acumuladoTotal / metaMensal) * 100;
            }

            atualizarGraficoDia(
                percentualDia,
                vendaHoje,
                metaHoje
            );

            atualizarGraficoMes(
                percentualMes,
                acumuladoTotal,
                faltanteMes
            );

            // RESUMO
            document.getElementById('meta-dia').innerText =
                formatarMoeda(metaHoje);

            document.getElementById('meta-mes').innerText =
                formatarMoeda(metaMensal);

            document.getElementById('acumulado-total').innerText =
                formatarMoeda(acumuladoTotal);

            document.getElementById('faltante-mes').innerText =
                formatarMoeda(
                    faltanteMes > 0
                        ? faltanteMes
                        : 0
                );
        }

        function atualizarGraficoDia(percentual, vendido, meta) {

            const percentualVisual =
                percentual > 100 ? 100 : percentual;

            const percent =
                document.getElementById('percent-dia');

            const circle =
                document.getElementById('circle-dia');

            const status =
                document.getElementById('status-dia');

            const extra =
                document.getElementById('extra-dia');

            let classe = 'vermelho';

            if (percentual >= 70) {
                classe = 'laranja';
            }

            if (percentual >= 100) {
                classe = 'verde';
            }

            percent.innerText =
                `${percentual.toFixed(0)}%`;

            percent.className =
                `percent ${classe}`;

            document.getElementById('valor-dia').innerText =
                formatarMoeda(vendido);

            if (percentual >= 100) {

                status.innerText =
                    'ATINGIDO 🎯';

                const excedente =
                    vendido - meta;

                extra.innerHTML =
                    `<span class="verde">
                        + ${formatarMoeda(excedente)}
                        acima da meta
                    </span>`;

            } else {

                status.innerText =
                    'META DO DIA';

                const faltante =
                    meta - vendido;

                extra.innerHTML =
                    `<span class="laranja">
                        Faltam
                        ${formatarMoeda(faltante)}
                    </span>`;
            }

            const raio = 251.2;

            circle.style.strokeDashoffset =
                raio - (
                    (percentualVisual / 100) * raio
                );

            if (percentual >= 100) {

                circle.style.stroke =
                    'var(--accent)';

            } else if (percentual >= 70) {

                circle.style.stroke =
                    'var(--warning)';

            } else {

                circle.style.stroke =
                    'var(--danger)';
            }
        }

        function atualizarGraficoMes(percentual, acumulado, faltante) {

            const percentualVisual =
                percentual > 100 ? 100 : percentual;

            const percent =
                document.getElementById('percent-mes');

            const circle =
                document.getElementById('circle-mes');

            percent.innerText =
                `${percentual.toFixed(0)}%`;

            document.getElementById('valor-mes').innerText =
                formatarMoeda(acumulado);

            if (faltante > 0) {

                document.getElementById('extra-mes').innerText =
                    `Faltam ${formatarMoeda(faltante)}`;

            } else {

                document.getElementById('extra-mes').innerText =
                    'Meta mensal atingida 🎯';
            }

            const raio = 251.2;

            circle.style.strokeDashoffset =
                raio - (
                    (percentualVisual / 100) * raio
                );
        }

        function zerarDashboard() {

            document.getElementById('percent-dia').innerText = '0%';
            document.getElementById('percent-mes').innerText = '0%';

            document.getElementById('valor-dia').innerText =
                'R$ 0,00';

            document.getElementById('valor-mes').innerText =
                'R$ 0,00';

            document.getElementById('extra-dia').innerHTML = '';
            document.getElementById('extra-mes').innerHTML = '';

            document.getElementById('meta-dia').innerText =
                'R$ 0,00';

            document.getElementById('meta-mes').innerText =
                'R$ 0,00';

            document.getElementById('acumulado-total').innerText =
                'R$ 0,00';

            document.getElementById('faltante-mes').innerText =
                'R$ 0,00';

            document.getElementById('circle-dia').style.strokeDashoffset =
                251.2;

            document.getElementById('circle-mes').style.strokeDashoffset =
                251.2;
        }

        function resetarSistema() {

            if (confirm('Deseja apagar todos os dados?')) {

                localStorage.removeItem(DB_KEY);

                dadosLojas = {};

                carregarLojaSelecionada();
            }
        }

    </script>

</body>

</html>
